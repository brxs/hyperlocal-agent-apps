[package]
name = "hyperlocal-agent-apps"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A WIT-only WebAssembly component runtime exposed over MCP"
license = "MIT"

[dependencies]
anyhow = "1"
mdns-sd = "=0.21.4"
reqwest = { version = "=0.12.28", default-features = false }
sha2 = "=0.10.9"
tempfile = "3"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "=1.8.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "sync", "time", "signal"] }
tokio-util = "0.7"
wasmtime = { version = "=45.0.1", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "wat", "anyhow"] }
wit-component = "=0.244.0"
wat = "1"
wasmparser = "=0.248.0"
